<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://unpkg.com/lucide@latest"></script>
    <header>
        <h2>ADD A NEW TASK</h2>
        <form id="task-form">
            <div class="input-group">
                <input type="text" id="task-input" placeholder=" " required>
                <label for="task-input">Enter a new task</label>
                <span class="underlined"></span>
            </div>
            <div class="input-group">
                <input type="text" id="task-description" placeholder=" ">
                <label for="task-description">Enter a description</label>
                <span class="underlined"></span>
            </div>
            <button type="submit">Add Task</button>
        </form>
    </header>
    <main>
        <h2>MY TASKS</h2>
        <section class="task-section">
            <div class="task-table">
                <div class="task-header">
                    <h3>Done</h3>
                    <h3>Task Name</h3>
                    <h3>Description</h3>
                    <h3>Status</h3>
                    <h3>Actions</h3>
                </div>
                <div id="task-list"></div>
            </div>
        </section>
    </main>
    <dialog id="edit-dialog">
        <form id="edit-form">
            <h2>Edit task</h2>
            <div class="input-group">
                <input type="text" id="edit-name" required>
                <label for="edit-name">Enter a new name</label>
                <span class="underlined"></span>
            </div>
            <div class="input-group">
                <input id="edit-description"></input>
                <label for="edit-description">Enter a new description</label>
                <span class="underlined"></span>
            </div>
            <div class="edit-actions">
                <button type="button" id="cancel-btn">
                    Cancel
                </button>
                <button type="submit" id="save-btn">
                    Save Changes
                </button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
